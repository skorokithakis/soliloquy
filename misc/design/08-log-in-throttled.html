<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Soliloquy: log in</title>
<script src="2ac970aa-3976-41ee-baef-49ed103c56da"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sq{--bg:#f5f4ef;--panel:#ecebe4;--card:#fbfaf6;--ink:#1c1b18;--muted:#625e55;--line:#d6d3c8;--line2:#e4e1d8;--accent:#a34b00;--on-accent:#fffaf2;--soft:#f6e4cc;--live:#25702d;--danger:#b3261e;--mark:#f5d79e;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;min-height:100vh;box-sizing:border-box}
.sq.dark{--bg:#0f110e;--panel:#171a15;--card:#13160f;--ink:#e6e3d6;--muted:#a09c8f;--line:#30342b;--line2:#22261f;--accent:#ffb23e;--on-accent:#1b1305;--soft:#33260f;--live:#6fd178;--danger:#ff8a80;--mark:#5a3f0e}
@media (prefers-color-scheme:dark){.sq.auto{--bg:#0f110e;--panel:#171a15;--card:#13160f;--ink:#e6e3d6;--muted:#a09c8f;--line:#30342b;--line2:#22261f;--accent:#ffb23e;--on-accent:#1b1305;--soft:#33260f;--live:#6fd178;--danger:#ff8a80;--mark:#5a3f0e}}
.sq *{box-sizing:border-box}
.sq a{color:inherit;text-decoration:none}
.sq a:hover{color:var(--accent)}
.logo{font:600 22px 'IBM Plex Mono',monospace;display:flex;align-items:center;gap:8px;color:var(--ink)}
.logo .p{color:var(--accent)}
.cur{display:inline-block;width:11px;height:21px;background:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:22px 22px 18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font:500 12px 'IBM Plex Mono',monospace}
.inp{height:40px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:14px 'IBM Plex Mono',monospace;padding:0 11px;width:100%}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 14px;border:1px solid var(--accent);border-radius:4px;background:var(--accent);color:var(--on-accent);font:500 14px 'IBM Plex Mono',monospace;cursor:pointer;width:100%}
.btn:disabled{background:none;color:var(--muted);border-color:var(--line);cursor:not-allowed}
.err{border:1px solid var(--danger);color:var(--danger);border-radius:4px;padding:8px 10px;font:12.5px/1.5 'IBM Plex Mono',monospace;display:flex;gap:8px}
.getty{font:12.5px/1.7 'IBM Plex Mono',monospace;color:var(--muted);margin:0 0 18px;white-space:pre}
</style>
</helmet>
<div class="sq {{theme}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 16px">
<div style="width: 100%; max-width: 380px">
<div class="logo" style="margin-bottom: 6px"><span class="p">›</span>soliloquy<span class="cur"></span></div>
<pre class="getty">a private forum · members only
tty1 · {{host}}</pre>
</div>
<form class="card" aria-label="Log in">
<div style="display: flex; flex-direction: column; gap: 14px">
<div class="field"><label for="u">login:</label><input id="u" class="inp" value="jules" autocomplete="username"></div>
<div class="field"><label for="p">password:</label><input id="p" class="inp" type="password" value="hunter22" autocomplete="current-password"></div>
<div class="err" role="alert"><span aria-hidden="true">!</span><span>Login incorrect. Wait <b>16 s</b> before the next try. The wait doubles after each miss, up to one minute.</span></div>
<button class="btn" type="submit" disabled="">wait 16s</button>
</div>
</form>
<p style="max-width: 380px; width: 100%; margin: 14px 0 0; font: 12px/1.6 'IBM Plex Mono', monospace; color: var(--muted)">No account? You need an invite link from a member.<br>Forgot your password? Ask an admin for a reset link.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;auto&quot;],&quot;default&quot;:&quot;light&quot;},&quot;host&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;forum.example.org&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:700}}">
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', host: this.props.host ?? 'forum.example.org' };
  }
}
</script>


</body></html>
