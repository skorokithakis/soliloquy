{{define "content"}}
<h1>Reset password</h1>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
{{if .Valid}}
<form method="post" action="/reset/{{.Token}}">
	<label>New password
		<input type="password" name="password" autocomplete="new-password" required autofocus>
	</label>
	<label>Confirm new password
		<input type="password" name="confirm_password" autocomplete="new-password" required>
	</label>
	<button type="submit">Set password</button>
</form>
<p class="hint">Setting a new password signs out all of the account's sessions.</p>
{{else}}
<p><a href="/login">Go to log in</a></p>
{{end}}
{{end}}
